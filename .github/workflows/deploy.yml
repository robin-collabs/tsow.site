name: Deploy to GitHub Pages

# Runs only for version tags (e.g. v0.2.0) or manual dispatch — normal pushes skip it.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: pages
        uses: actions/configure-pages@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run build
        env:
          GITHUB_PAGES: "true"
          PAGES_BASE: ${{ steps.pages.outputs.base_path }}/
      - name: Collect static site
        run: |
          OUT=.output/public
          [ -d "$OUT" ] || OUT=dist/client
          mkdir -p site && cp -r "$OUT"/. site/
          [ -f site/_shell.html ] && cp site/_shell.html site/index.html
          cp site/index.html site/404.html
          cp public/CNAME site/CNAME
          touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
